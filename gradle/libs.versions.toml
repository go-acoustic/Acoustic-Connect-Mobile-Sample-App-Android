[versions]
agp = "8.13.1"
# Kotlin is pinned to 1.9.x for two reasons:
#   1. Compose compiler extension 1.5.8 (composeOptions in sample-compose/build.gradle.kts)
#      requires Kotlin < 2.0. Upgrading to Kotlin 2.0+ requires migrating to the standalone
#      org.jetbrains.kotlin.plugin.compose plugin and a matching compiler extension.
#   2. Huawei AGConnect plugin (agcp 1.9.1.304) is not yet compatible with Kotlin 2.0.
kotlin = "1.9.22"
coreKtx = "1.13.1"
junit = "4.13.2"
orgJson = "20240303"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.7.0"
activityCompose = "1.9.0"
composeBom = "2026.03.00"
googleServices = "4.4.2"
firebaseBom = "33.7.0"
agcp = "1.9.1.304"
gradle = "8.13.1"
spotbugs = "5.0.14"
androidx-lifecycle = "2.6.2"
androidx-navigation = "2.7.5"
# navigation-fragment-ktx and navigation-ui-ktx are a matched pair and must stay on the same
# version; before the two samples were merged they were on 2.7.5 and 2.7.7 respectively.
androidx-navigation-views = "2.7.7"
androidxLib = "1.6.1"
material = "1.12.0"
constraintlayout = "2.1.4"
# One version for every Acoustic SDK coordinate. The publish pipeline rewrites this single line
# (lay-down-sample.sh) and the e2e job injects into it, so both samples always demonstrate the
# same SDK build: sample-compose on connect-push, sample-xml on the analytics-only connect.
connectSdk = "11.1.7-beta"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxLib" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
agcp = { module = "com.huawei.agconnect:agcp", version.ref = "agcp" }
gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }
androidx-lifecycle-viewModelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidx-navigation" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation-views" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation-views" }
connect = { module = "io.github.go-acoustic:connect", version.ref = "connectSdk" }
connect-push = { module = "io.github.go-acoustic:connect-push", version.ref = "connectSdk" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
agconnect = { id = "com.huawei.agconnect", version.ref = "agcp" }
